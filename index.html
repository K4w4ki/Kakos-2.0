<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Kako — Assistente IA inteligente e brincalhão">
    <meta name="theme-color" content="#f97316">
    <meta name="color-scheme" content="dark light">
    
    <title>Kako · Assistente IA</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Design System em Camadas -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/animations.css">
    
    <link rel="icon" type="image/png" href="image/kako-profile.png">
</head>
<body>
    <!-- Skip link para acessibilidade -->
    <a href="#main-content" class="skip-link">Pular para o conteúdo</a>
    
    <!-- Preloader -->
    <div id="preloader" class="preloader" aria-hidden="true">
        <div class="preloader__content">
            <div class="preloader__logo">
                <img src="image/kako-profile.png" alt="" width="80" height="80">
                <div class="preloader__ring"></div>
            </div>
            <div class="preloader__brand">
                <span>K</span><span>a</span><span>k</span><span>o</span>
            </div>
            <div class="preloader__bar"><div class="preloader__bar-fill"></div></div>
        </div>
    </div>

    <!-- App -->
    <div id="app" class="app" role="application" aria-label="Kako Chat"></div>

    <!-- Toasts -->
    <div id="toast-root" class="toast-root" role="region" aria-live="polite" aria-label="Notificações"></div>

    <!-- Modal root -->
    <div id="modal-root"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
